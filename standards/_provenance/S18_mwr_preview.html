document.oncontextmenu = new Function("return false;");//禁止浏览器右键
document.onkeydown = document.onkeyup = document.onkeypress = function(event) {//禁止浏览器F12
	var e = event || window.event || arguments.callee.caller.arguments[0];
	if (e && (e.keyCode == 123 || e.keyCode == 116)) {
		e.returnValue = false;
		return (false);
	}
}
var timeoutInt; // 要保证最后要运行一次
var pageTotal="269";//总页码
var pageIndex=1;//当前页面
var fname="水工建筑物与堰槽测流规范";//文件名称
var fnameId="b0db7b03-eac5-471b-9252-d3254374edyb";//文件id
// window.onscroll窗口添加滚动条事件
window.onscroll = function () {
	setTimeout(function () {
		if (timeoutInt != undefined) {
			window.clearTimeout(timeoutInt);
		}
		timeoutInt = window.setTimeout(function () {
			//监听事件内容
			if(getScrollHeight() == getDocumentTop() + getWindowHeight()){
				//当滚动条到底时,这里是触发内容
				//异步请求数据,局部刷新dom
				if(pageTotal>2){
					nextPage();
				}else{
					alert("文档已加载完成！");
					return;
				}
			}else if(getDocumentTop()==0){
				upPage();
			}
		}, 105);
	}, 100);
}

//（浏览器窗口上边界内容高度）
function getDocumentTop() {
	var scrollTop = 0, bodyScrollTop = 0, documentScrollTop = 0;
	if (document.body) {
		bodyScrollTop = document.body.scrollTop;
	}
	if (document.documentElement) {
		documentScrollTop = document.documentElement.scrollTop;
	}
	scrollTop = (bodyScrollTop - documentScrollTop > 0) ? bodyScrollTop : documentScrollTop;
	console.log("scrollTop:"+scrollTop);
	return scrollTop;
}
//可视窗口高度（屏幕可以看见的高度）
function getWindowHeight() {
	var windowHeight = 0;
	if (document.compatMode == "CSS1Compat") {
		windowHeight = document.documentElement.clientHeight;
	} else {
		windowHeight = document.body.clientHeight;
	}
	console.log("windowHeight:"+windowHeight);
	return windowHeight;
}
//滚动条滚动高度（即整个网页的高度）
function getScrollHeight() {
	var scrollHeight = 0, bodyScrollHeight = 0, documentScrollHeight = 0;
	if (document.body) {
		bodyScrollHeight = document.body.scrollHeight;
	}
	if (document.documentElement) {
		documentScrollHeight = document.documentElement.scrollHeight;
	}
	scrollHeight = (bodyScrollHeight - documentScrollHeight > 0) ? bodyScrollHeight : documentScrollHeight;
	console.log("scrollHeight:"+scrollHeight);
	return scrollHeight;
}
function nextPage() {//页面右侧滚轴滚动到底部时，触发加载下一张照片
	if(pageIndex>pageTotal || pageTotal<3){
		alert("文档已加载完成！");
		return;
	}
	if($("#img_"+(pageIndex)).length>0){//已经加载过
		pageIndex++;
		$(".page_index").html(pageIndex);
		$(".page_total").html(pageTotal);
		if(document.querySelector("#img_"+pageIndex))document.querySelector("#img_"+pageIndex).scrollIntoView(true);
		return;
	}
    var param={
        //code:strEnc(pageIndex+"",'itmp','des','encrypt'),
		fnameId:fnameId,
		code:pageIndex,
		pnum:pageTotal
    };
    $.ajax({
        //url : '/xxfw/portal/yhzc!loadNextPic.do',
		url : 'imgServlet.jsp',
        dateType:'JSON',
        type :'POST',
        data : param,
        success : function(data){
            var item = eval("(" + data.replaceAll("\n","") + ")");
            if (item.success) {
				//$("#testImg").prop("src",item.base64str);
                //$("#testImg").prop("src","data:image/png;base64,"+Base64.decode(item.base64str));//base64解密
				//$("#imgdiv").append("<img id=\"img_"+pageIndex+"\" class=\"pic_bpx\" src=\"data:image/png;base64,"+Base64.decode(item.base64str)+"\" alt=\"\">");
				$("#imgdiv").append("<img id=\"img_"+pageIndex+"\" width=\"80%\" class=\"pic_bpx\" src=\"data:image/png;base64,"+item.base64str+"\" alt=\"\">");
				$(".page_index").html(pageIndex);
				$(".page_total").html(pageTotal);
				if(document.querySelector("#img_"+pageIndex))document.querySelector("#img_"+pageIndex).scrollIntoView(true);
				pageIndex++;
            } else {
                alert(item.msg);
            }
        }
    });
}
function upPage() {//翻页
	if(pageIndex<=1 || pageTotal<=2){
		alert("已是文档最顶端！");
		return;
	}
	pageIndex--;
	$(".page_index").html(pageIndex);
	$(".page_total").html(pageTotal);
	if(document.querySelector("#img_"+pageIndex))document.querySelector("#img_"+pageIndex).scrollIntoView(true);
}
</script>
