<script>
    function browserRedirect() {
        var articleId = GetQueryString("articleId");
        var sUserAgent = navigator.userAgent.toLowerCase();
        if (/ipad|iphone|midp|rv:1.2.3.4|ucweb|android|windows ce|windows mobile/.test(sUserAgent)) {
            //跳转移动端页面
            window.location.href="/htmls/article/wap-article.html?articleId=" +articleId ;
        }
    }



    // 动态设置iframe高度
    function setIframeHeight() {
        var iframe = document.getElementById("iframe");//iframe的ID

        var tag = false
        var iframeHeight = function() {
            tag = false
            var hash = window.location.hash.slice(1);
            if (hash && /iframeHeight=/.test(hash)) {
                tag = true
                iframe.height = hash.replace("iframeHeight=", "");
            }
            if (tag) {
                clearInterval(timer)
            }
        };
        var timer = setInterval(iframeHeight, 200)
    }

    function GetQueryString(name) {
        var reg = new RegExp("(^|&)"+ name +"=([^&]*)(&|$)");
        var r = window.location.search.substr(1).match(reg);
        if (r != null) {
            return unescape(r[2]);
        }
        return null;
    }
    function getActiveUrl(name) {
        var url
        switch(name) {
            case	'建言献策': url =  'https://www.ndrc.gov.cn/hdjl/jyxc/'; break;
            case '网上公示及调查': url =  'https://www.ndrc.gov.cn/hdjl/wsgsjdc/'; break;
            case '意见征求': url =  'https://www.ndrc.gov.cn/hdjl/yjzq/'; break;
            default: url =  'https://www.ndrc.gov.cn/hdjl/yjzq/';
        }
        return url
    }
    function getDate () {
        var articleId = GetQueryString("articleId");
        $.ajax({
            type: 'get',
            url: '/public/submission-service/column/getArticleDetail?articleId=' + articleId,
            success: function(response) {
                if (response.data.relatedArticles && response.data.relatedArticlesUrl) {
                    $('.yjfk').show()
                } else {
                    $('.yjfk').html("")
                    //$('.yjzq-left').css('width','100%')
                }
                $('title').html(response.data.articleTitle.replace(/<br>/ig, ""));
                if(response.data.insertApply === 'YES') {
                    $('.yj_from').show()

                    setIframeHeight();
                } else {
                    $('.yj_from').html("")
                }
                var url = getActiveUrl(response.data.columnName);
                $('#breadMenuItem').attr('href', url)
                if(response.data.columnName){
                    $('#breadMenuItem').html(response.data.columnName)
                    if(response.data.columnName == '建言献策'){
                        $('#breadMenuItem2').html("建言反馈")
                    }else if(response.data.columnName == '意见征求'){
                        $('#breadMenuItem2').html("意见反馈")
                    }

                }
                if(response.data.publishDate){
                    var re = new RegExp("-","g");
                    $('.time').html("发布时间：" + response.data.publishDate.replace(re,"/"));
                }
                if(response.data.articleSource){
                    $('.laiyuantext').css("display","block")
                    $('#ly-1').html(response.data.articleSource)
                }else{
                    $('.laiyuantext').css("display","none")
                }

                $('.yjzq-left h2').html(response.data.articleTitle)
                $('.yjzq-content').html(response.data.articleContent)
                $('#iframe').attr('src', response.data.inputAddress)
                $('.yjfk ul a').attr('href', response.data.relatedArticlesUrl)
                $('.yjfk ul a').text(response.data.relatedArticles)
            }
        })
    }
    getDate()
    browserRedirect();

    }
