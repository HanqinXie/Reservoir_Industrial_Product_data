<script>
(function() {
    var STORAGE_KEY = 'kqqw_search_history';
    var MAX_HISTORY = 10;
    var currentKeyword = document.querySelector('.search-summary strong:last-child');
    var keyword = currentKeyword ? currentKeyword.textContent.trim() : '';
    function saveHistory(keyword) {
        if (!keyword) return;
        var history = JSON.parse(localStorage.getItem(STORAGE_KEY) || '[]');
        history = history.filter(function(item) { return item !== keyword; });
        history.unshift(keyword);
        if (history.length > MAX_HISTORY) {
            history = history.slice(0, MAX_HISTORY);
        }
        localStorage.setItem(STORAGE_KEY, JSON.stringify(history));
    }
    function renderHistory() {
        var container = document.getElementById('searchHistory');
        if (!container) return;
        var history = JSON.parse(localStorage.getItem(STORAGE_KEY) || '[]');
        if (history.length === 0) {
            container.innerHTML = '';
            return;
        }
        var html = '<span class="history-label">最近搜索：</span>';
        history.forEach(function(item, index) {
            html += '<span class="history-item" data-keyword="' + encodeURIComponent(item) + '">' + escapeHtml(item) + '</span>';
        });
        html += '<span class="history-clear" id="clearHistory">清空</span>';
        container.innerHTML = html;
        container.querySelectorAll('.history-item').forEach(function(el) {
            el.addEventListener('click', function(e) {
                var kw = decodeURIComponent(this.getAttribute('data-keyword'));
                window.location.href = '/e/sch/index.php?keyboard=' + encodeURIComponent(kw) + '&Submit=搜索';
            });
        });
        var clearBtn = document.getElementById('clearHistory');
        if (clearBtn) {
            clearBtn.addEventListener('click', function() {
                localStorage.removeItem(STORAGE_KEY);
                renderHistory();
            });
        }
    }
    function escapeHtml(text) {
        var div = document.createElement('div');
        div.textContent = text;
        return div.innerHTML;
    }
    if (keyword) {
        saveHistory(keyword);
    }
    renderHistory();
})();
</script>
