[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "reservoir-inventory-prototype"
version = "0.1.0"
description = "Reproducible daily reservoir and industrial inventory M0/M1/M2 linear model"
requires-python = ">=3.10"
dependencies = [
  "numpy>=1.24,<3",
  "pandas>=2.1,<3",
  "scipy>=1.11,<2",
  "matplotlib>=3.7,<4",
]

[project.scripts]
reservoir-inventory = "reservoir_inventory.cli:main"

[tool.setuptools.packages.find]
where = ["src"]
